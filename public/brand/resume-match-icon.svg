<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Resume Match icon</title>
  <desc id="desc">Two overlapping resume documents in pink tones.</desc>
  <defs>
    <linearGradient id="backGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD1DC"/>
      <stop offset="1" stop-color="#FF9AB4"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4F79"/>
      <stop offset="1" stop-color="#FF2F67"/>
    </linearGradient>
  </defs>

  <!-- back document -->
  <rect x="86" y="82" width="242" height="300" rx="34" fill="url(#backGrad)"/>
  <rect x="126" y="144" width="120" height="18" rx="9" fill="#FF4F79"/>
  <rect x="126" y="198" width="150" height="18" rx="9" fill="#FF4F79"/>
  <rect x="126" y="252" width="112" height="18" rx="9" fill="#FF4F79"/>

  <!-- front document with folded corner -->
  <path d="M210 156c0-18 14-32 32-32h150l64 64v206c0 18-14 32-32 32H242c-18 0-32-14-32-32V156Z" fill="url(#frontGrad)"/>
  <path d="M392 124v50c0 18 14 32 32 32h32" fill="#FFB1C4"/>

  <rect x="270" y="238" width="116" height="20" rx="10" fill="#FFFFFF"/>
  <rect x="270" y="288" width="138" height="20" rx="10" fill="#FFFFFF"/>
  <rect x="270" y="338" width="138" height="20" rx="10" fill="#FFFFFF"/>
</svg>
